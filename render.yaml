services:
  - type: web
    name: ethnokg-platform
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./ethno_kg.db
      - key: CORS_ORIGINS
        value: "['*']"
      - key: DEFAULT_CONFIDENCE_THRESHOLD
        value: "0.75"
